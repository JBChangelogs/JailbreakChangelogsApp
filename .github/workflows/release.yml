name: Release

# Run manually from the Actions tab after bumping the version and changelog on main.
on:
  workflow_dispatch:

concurrency: release

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: ubuntu-latest
            script: build:linux
          - os: macos-latest
            script: build:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Velopack CLI
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet tool install -g vpk
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - run: npm ci

      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.nupkg
            dist/*-Setup.exe
            dist/RELEASES
            dist/*.json
            dist/latest-linux.yml
            dist/*.AppImage
            dist/*.dmg

  # One upload for all platforms, so the stale-nupkg cleanup sees the whole release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload to R2
        run: node build/upload-release.mjs
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
