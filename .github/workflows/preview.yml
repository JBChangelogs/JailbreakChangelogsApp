name: Preview

on:
  workflow_dispatch:

concurrency: pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - run: npm run preview:snapshot

      - run: npm run preview:build

      - name: Install ffmpeg
        run: |
          curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"

      - name: Record preview video and GIF
        run: node preview/record.mjs

      - uses: actions/upload-pages-artifact@v4
        with:
          path: preview/dist

      - id: deploy
        uses: actions/deploy-pages@v4
