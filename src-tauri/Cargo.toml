[package]
name = "jailbreak-changelogs"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "jbcl_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["devtools", "macos-private-api"] }
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-deep-link = "2.6"
tauri-plugin-updater = "2.14"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4"
discord-rich-presence = "1.1"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-24"] }
rusty-leveldb = "4"
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
ring = "0.17"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
notify-rust = "4"
sys-locale = "0.3"
tokio = { version = "1", features = ["time", "sync", "macros"] }

[target.'cfg(windows)'.dependencies]
xcap = "0.9"
aes-gcm = "0.10"
base64 = "0.22"
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Memory"] }
windows-version = "0.1"

[target.'cfg(target_os = "macos")'.dependencies.ort]
version = "=2.0.0-rc.15"
default-features = false
features = ["coreml"]

[target.'cfg(unix)'.dependencies]
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
xcap = "0.9"
security-framework = "3"

[target.'cfg(target_os = "linux")'.dependencies]
xcap = "0.4.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
