name: Release

on:
  workflow_dispatch:

concurrency: release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ort: win32-x64
            args: --bundles nsis
            bundle: src-tauri/target/release/bundle
          - os: ubuntu-22.04
            ort: linux-x64
            args: --bundles appimage
            bundle: src-tauri/target/release/bundle
          - os: macos-latest
            ort: darwin-arm64
            args: --target universal-apple-darwin --bundles app,dmg
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libdbus-1-dev libxcb1-dev libxrandr-dev \
            libwayland-dev libegl-dev libgbm-dev

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - run: node build/make-ocr-pack.mjs ${{ matrix.ort }}

      - run: npm run typecheck

      - run: npx tauri build ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-tauri/ocr
          cp src-tauri/ocr-pack/*.zip dist-tauri/ocr/
          b="${{ matrix.bundle }}"
          case "${{ runner.os }}" in
            Windows)
              cp "$b"/nsis/*-setup.exe dist-tauri/JBCLSetup.exe
              cp "$b"/nsis/*-setup.exe.sig dist-tauri/JBCLSetup.exe.sig ;;
            Linux)
              cp "$b"/appimage/*.AppImage dist-tauri/JBCLSetup.AppImage
              cp "$b"/appimage/*.AppImage.sig dist-tauri/JBCLSetup.AppImage.sig ;;
            macOS)
              cp "$b"/dmg/*.dmg dist-tauri/JBCLSetup.dmg
              cp "$b"/macos/*.app.tar.gz dist-tauri/JBCLSetup.app.tar.gz
              cp "$b"/macos/*.app.tar.gz.sig dist-tauri/JBCLSetup.app.tar.gz.sig ;;
          esac
          ls -la dist-tauri

      - uses: actions/upload-artifact@v7
        with:
          name: tauri-${{ runner.os }}
          if-no-files-found: error
          path: dist-tauri/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - uses: actions/download-artifact@v8
        with:
          path: dist-tauri
          merge-multiple: true

      - name: Release notes
        run: node --experimental-strip-types build/release-notes.mjs > release-notes.md

      - name: Upload to R2
        run: node build/upload-tauri-release.mjs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Notify running apps
        env:
          APP_RELEASE_API_KEY: ${{ secrets.APP_RELEASE_API_KEY }}
        run: |
          if [ -z "$APP_RELEASE_API_KEY" ]; then
            echo "::warning::APP_RELEASE_API_KEY is not set; apps will pick up the release on their next check."
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          if ! response=$(curl -sS --fail-with-body --max-time 20 -X POST \
            https://api.jailbreakchangelogs.com/v2/realtime/app-update \
            -H "Authorization: $APP_RELEASE_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"version\": \"$version\"}"); then
            echo "::warning::Couldn't notify running apps: $response"
            exit 0
          fi
          echo "Notified running apps of $version: $response"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "v$version" dist-tauri/JBCLSetup.exe dist-tauri/JBCLSetup.AppImage dist-tauri/JBCLSetup.dmg \
            --title "v$version" --notes-file release-notes.md --target "$GITHUB_SHA"
