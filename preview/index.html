<style>
  :root {
    color-scheme: dark;
    --primary-bg: #121317;
    --secondary-bg: #17181d;
    --tertiary-bg: #1c1e24;
    --quaternary-bg: hsl(225, 4%, 25%);
    --primary-text: hsl(60, 5%, 97%);
    --secondary-text: hsl(214, 16%, 64%);
    --tertiary-text: hsl(214, 12%, 45%);
    --quaternary-text: hsl(214, 8%, 35%);
    --border-primary: hsl(214, 8%, 20%);
    --border-card: hsl(214, 8%, 22%);
    --border-focus: hsl(210, 99%, 50%);
    --link: hsl(210, 100%, 70%);
    --button-info: hsl(210, 99%, 35%);
    --button-danger: hsl(0, 81%, 62%);
    --button-secondary: hsl(212, 14%, 22%);
    --form-button-text: hsl(60, 100%, 100%);
    --status-success: hsl(155, 61%, 30%);
    --status-success-vibrant: hsl(120, 61%, 50%);
    --status-warning: hsl(38, 100%, 61%);
    --status-error: hsl(0, 81%, 45%);
    --card-tag-bg: hsl(210, 99%, 50%);
    --status-info: hsl(210, 99%, 50%);
    --stage: #0b0c0f;
    --sans: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  * {
    box-sizing: border-box;
  }

  html {
    min-height: 100%;
    background: var(--stage);
  }

  body {
    margin: 0;
    background: var(--stage);
    color: var(--primary-text);
    font-family: var(--sans);
    padding: 32px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: default;
  }

  svg {
    display: block;
  }

  /* flex-shrink: 0 everywhere in the column, or a short iframe squeezes the
     stage below the scaled window and the text below draws over it */
  body > * {
    flex-shrink: 0;
  }

  .stage {
    width: 100%;
    max-width: 1280px;
    position: relative;
  }

  .stage::before {
    content: "";
    position: absolute;
    inset: 8% 10%;
    background: radial-gradient(closest-side, hsl(210 99% 50% / .22), transparent);
    filter: blur(40px);
    pointer-events: none;
  }

  /* The real app runs in this iframe at its native 1280x800 and is scaled to fit */
  .win {
    width: 1280px;
    height: 800px;
    transform-origin: 0 0;
    position: absolute;
    top: 0;
    left: 0;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border-primary);
    background: var(--primary-bg);
  }

  /* Stacked, so the next app can load hidden under the visible one */
  .win iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    pointer-events: none;
  }

  /* The app's own loading screen, shown until the first app has drawn */
  .splash {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .splash img {
    width: 64px;
    height: 64px;
    border-radius: 50%;
  }

  .splash div {
    width: 24px;
    height: 24px;
    border: 3px solid color-mix(in srgb, var(--primary-text) 15%, transparent);
    border-top-color: var(--status-info);
    border-radius: 50%;
    animation: splash-spin .8s linear infinite;
  }

  @keyframes splash-spin {
    to {
      transform: rotate(360deg)
    }
  }

  .cursor {
    position: absolute;
    left: 0;
    top: 0;
    width: 12px;
    height: 19px;
    z-index: 50;
    pointer-events: none;
    overflow: visible;
    transition: transform var(--glide, .7s) cubic-bezier(.45, .05, .25, 1);
    filter: drop-shadow(1px 1px 1px rgba(0, 0, 0, .35));
  }

  .ripple {
    position: absolute;
    width: 28px;
    height: 28px;
    margin: -14px 0 0 -14px;
    border-radius: 99px;
    border: 2px solid hsl(210 99% 60%);
    z-index: 49;
    pointer-events: none;
    animation: ripple .45s ease-out forwards;
  }

  @keyframes ripple {
    from {
      transform: scale(.3);
      opacity: 1
    }

    to {
      transform: scale(1.4);
      opacity: 0
    }
  }

  /* The game behind the hidden app, under a copy of the scanner's picker (src/renderer/picker.html). */
  .snip {
    position: absolute;
    inset: 0;
    z-index: 40;
    overflow: hidden;
    pointer-events: none;
    font-family: system-ui, sans-serif;
  }

  .snip img {
    position: absolute;
    top: 0;
    left: 50%;
    height: 100%;
    transform: translateX(-50%);
  }

  .pick-shade {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, .35);
  }

  .pick-box {
    position: absolute;
    display: none;
    width: 0;
    height: 0;
    border: 2px solid #4c9fff;
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, .35);
    transition: width var(--glide, .7s) cubic-bezier(.45, .05, .25, 1), height var(--glide, .7s) cubic-bezier(.45, .05, .25, 1);
  }

  .pick-hint {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 14px;
    border-radius: 8px;
    background: rgba(18, 19, 23, .92);
    color: #fff;
    font-size: 14px;
    white-space: nowrap;
  }

  /* The picker's crosshair cursor. */
  .crosshair {
    position: absolute;
    left: -10px;
    top: -10px;
    width: 21px;
    height: 21px;
    z-index: 50;
    display: none;
    pointer-events: none;
    transition: transform var(--glide, .7s) cubic-bezier(.45, .05, .25, 1);
  }

  .crosshair::before,
  .crosshair::after {
    content: '';
    position: absolute;
    background: #000;
    outline: 1px solid #fff;
  }

  .crosshair::before {
    left: 10px;
    top: 0;
    width: 1px;
    height: 21px;
  }

  .crosshair::after {
    top: 10px;
    left: 0;
    width: 21px;
    height: 1px;
  }

  .snip-pip {
    position: absolute;
    right: 18px;
    bottom: 18px;
    z-index: 40;
    width: 384px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border-primary);
    box-shadow: 0 12px 32px rgb(0 0 0 / .5);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .25s, transform .25s;
    pointer-events: none;
  }

  .snip-pip.on {
    opacity: 1;
    transform: none;
  }

  .snip-pip img {
    display: block;
    width: 100%;
  }

  /* The trade window in the 1920x1035 screenshot, scaled to the 384px-wide view. */
  .snip-pip-area {
    position: absolute;
    left: 96px;
    top: 57px;
    width: 193px;
    height: 119px;
    border: 2px solid #4c9fff;
    animation: snip-pulse 1.2s ease-in-out infinite;
  }

  .snip-pip span {
    position: absolute;
    left: 8px;
    bottom: 8px;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgb(0 0 0 / .7);
    color: #fff;
    font: 600 11px/1.2 system-ui, sans-serif;
  }

  @keyframes snip-pulse {
    50% {
      border-color: rgb(76 159 255 / .35);
    }
  }

  .tip {
    position: absolute;
    z-index: 48;
    background: var(--tertiary-bg);
    border: 1px solid var(--border-card);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 12px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s;
  }

  .tip.on {
    opacity: 1;
  }

  /* Tabs + backdrop follow the embedding site's theme: tour.ts sets these from the theme's colors.
     The values here are the dark theme's, for before it runs. */
  :root {
    --tab-bg: #17181d;
    --tab-active: #1c1e24;
    --tab-hover: hsl(225, 4%, 25%);
    --tab-text: hsl(214, 16%, 64%);
    --tab-text-active: hsl(60, 100%, 100%);
    --tab-border: hsl(214, 8%, 22%);
    --tab-fill: hsl(210 99% 35% / .2);
    --tab-accent: hsl(210, 100%, 70%);
  }


  .chapters {
    width: 100%;
    max-width: 1280px;
    min-width: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    border-radius: 16px;
    border: 1px solid var(--tab-border);
    background: var(--tab-bg);
    padding: 4px;
    color: var(--tab-text);
  }

  .chapters button {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    flex: 1 1 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 14px;
    line-height: 20px;
    font-weight: 500;
    white-space: nowrap;
    color: var(--tab-text);
    background: transparent;
    cursor: pointer;
    transition: color .2s, background-color .2s;
  }

  .chapters button:hover {
    background: var(--tab-hover);
    color: var(--tab-text-active);
  }

  .chapters button:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px var(--border-focus);
  }

  .chapters button[data-state="active"] {
    background: var(--tab-active);
    color: var(--tab-text-active);
  }

  .chapters .fill {
    position: absolute;
    inset: 0;
    z-index: -1;
    background: var(--tab-fill);
    transform-origin: left;
    opacity: 0;
    transition: opacity .3s;
  }

  .chapters button[data-state="active"] .fill {
    opacity: 1;
  }

  /* Feature copy under the preview, swapped with the active tab */
  .feature {
    width: 100%;
    max-width: 1280px;
    display: grid;
    gap: 12px 48px;
    padding: 8px 4px 0;
    color: var(--tab-text);
  }

  /* Staggered entrance on every tab switch: heading, description, then each point */
  .feature h3,
  .feature > div > p,
  .feature li {
    animation: feature-in .45s cubic-bezier(.2, .8, .2, 1) both;
    animation-delay: calc(var(--i, 0) * 70ms);
  }

  @keyframes feature-in {
    from {
      opacity: 0;
      transform: translateY(8px);
      filter: blur(2px);
    }
  }

  .feature[hidden] {
    display: none;
  }

  .feature h3 {
    margin: 0;
    font-size: 22px;
    line-height: 1.3;
    font-weight: 700;
    color: var(--tab-text-active);
    text-wrap: balance;
  }

  .feature > div > p {
    margin: 8px 0 0;
    font-size: 15px;
    line-height: 1.6;
    max-width: 60ch;
  }

  .feature ul {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .feature li {
    display: flex;
    gap: 10px;
    font-size: 14px;
    line-height: 1.6;
  }

  .feature li svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    margin-top: 3px;
    color: var(--tab-accent);
  }

  @media (min-width: 900px) {
    .feature {
      grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
    }
  }

  @keyframes app-preview-progress {
    from {
      transform: scaleX(0)
    }

    to {
      transform: scaleX(1)
    }
  }

  @media (min-width: 1024px) {
    .chapters {
      flex-wrap: nowrap;
    }

    .chapters button {
      flex: 1 1 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {

    .cursor,
    .ripple {
      display: none;
    }

    * {
      animation-duration: 0s !important;
      transition-duration: 0s !important;
    }
  }
</style>

<div class="chapters" id="chapters" role="tablist" aria-label="App features"></div>

<div class="stage" id="stage">
  <div class="win" id="win">
    <div class="splash" id="splash"><img src="../src/renderer/src/assets/icon.png" alt=""><div></div></div>
    <iframe id="app" title="Jailbreak Changelogs desktop app" tabindex="-1"></iframe>
    <svg class="cursor" id="cursor" width="12" height="19" viewBox="0 0 12 19" shape-rendering="crispEdges"></svg>
    <div class="tip" id="tip"></div>
  </div>
</div>

<section class="feature" id="feature" aria-live="polite"></section>

<script type="module" src="./tour.ts"></script>
